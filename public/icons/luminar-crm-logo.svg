<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="200" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="line" x1="40" y1="150" x2="160" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,1)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="198" height="90" rx="44" fill="white" fill-opacity="0.07"/>

  <!-- Pipeline trend line -->
  <polyline
    points="42,148  80,110  120,75  158,44"
    stroke="url(#line)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Stage nodes -->
  <circle cx="42"  cy="148" r="11" fill="white" fill-opacity="0.30"/>
  <circle cx="42"  cy="148" r="7"  fill="white"/>

  <circle cx="80"  cy="110" r="11" fill="white" fill-opacity="0.30"/>
  <circle cx="80"  cy="110" r="7"  fill="white"/>

  <circle cx="120" cy="75"  r="11" fill="white" fill-opacity="0.30"/>
  <circle cx="120" cy="75"  r="7"  fill="white"/>

  <circle cx="158" cy="44"  r="14" fill="white" fill-opacity="0.25"/>
  <circle cx="158" cy="44"  r="9"  fill="white"/>

  <!-- Star burst at apex -->
  <g transform="translate(158,44)" filter="url(#glow)">
    <line x1="0" y1="-18" x2="0"   y2="-28" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="13" y1="-13" x2="19" y2="-19" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="18" y1="0"   x2="28" y2="0"   stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="13" y1="13"  x2="19" y2="19"  stroke="white" stroke-width="2"   stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>

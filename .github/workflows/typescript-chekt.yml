name: TypeScript Check

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  typescript-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          # 1. Changed cache provider to yarn
          cache: "yarn"

      - name: Install Dependencies
        # 2. Combined redundant steps and used --frozen-lockfile for CI integrity
        # Use 'yarn install --immutable' if you are using Yarn Berry (v2+)
        run: yarn install --frozen-lockfile

      - name: TypeScript check
        # 3. Using yarn to execute the local tsc binary
        run: yarn tsc --noEmit
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
